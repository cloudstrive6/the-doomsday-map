# The Doomsday Map: channel and pipeline configuration. Agents read this; code reads this.
channel:
  name: "The Doomsday Map"
  handle: "@TheDoomsdayMap"
  url: "https://www.youtube.com/@TheDoomsdayMap"
  niche: "What-if scenarios for nuclear war, great-power war and doomsday events, simulated minute by minute on real maps"
  premise: "Real history and real data first, then a clearly labelled simulation built from published models, then what the world looks like after."
  language: en-US
  category_id: "27"          # Education
  made_for_kids: false
  default_tags: ["nuclear war", "what if", "simulation", "geopolitics", "map", "doomsday", "the doomsday map"]
  lanes:                     # topic discipline: everything outside these lanes needs Bryce's approval
    - nuclear war and nuclear weapons
    - great-power war and flashpoints (Taiwan, Korea, Iran, Baltic, Arctic)
    - EMP, infrastructure and cyber attacks on nations
  disclosure: "Narration is AI-generated. Scenario segments are simulations built from published models and are labelled on screen; nothing in them has happened."

voice:                       # Google Cloud TTS, Chirp 3: HD
  name: "en-US-Chirp3-HD-Enceladus"   # chosen by Bryce 2026-11-05 from the 10-voice audition
  language: en-US
  speaking_rate: 0.93
  target_wpm: [135, 150]
  pronunciations:
    - {phrase: "Suwalki", ipa: "suˈvɑlki"}
    - {phrase: "Rzeszow", ipa: "ˈʒɛʃuf"}
    - {phrase: "Kozelsk", ipa: "kɒˈzɛlsk"}
    - {phrase: "Offutt", ipa: "ˈɒfət"}
    - {phrase: "Minot", ipa: "ˈmaɪnɒt"}
    - {phrase: "Malmstrom", ipa: "ˈmɑlmstrəm"}
    - {phrase: "Gadzhiyevo", ipa: "ɡɑˈdʒijɛvoʊ"}
    - {phrase: "Vilyuchinsk", ipa: "vɪlˈjutʃɪnsk"}
    - {phrase: "Pituffik", ipa: "piˈtufɪk"}
    - {phrase: "Yars", ipa: "jɑrs"}
    - {phrase: "Sarmat", ipa: "sɑrˈmɑt"}
    - {phrase: "Bulava", ipa: "bulɑˈvɑ"}
  fallback_wpm: 145

video:
  fps: 60
  width: 1920
  height: 1080
  target_minutes: [11, 14]
  loudness_lufs: -14
  true_peak_db: -1.5
  music_volume: 0.10
  end_slate:
    seconds: 15
    title: "NEXT SCENARIO"
  tags: ["REAL DATA", "SIMULATION", "REAL HISTORY"]   # corner tag on every scene
  attribution: "Maps: Natural Earth (public domain), OpenStreetMap contributors (ODbL) via OpenFreeMap and OpenMapTiles. Imagery: NASA Blue Marble and Black Marble."

shorts:
  per_episode: 3
  length_s: [30, 60]
  width: 1080
  height: 1920
  ending: "payoff"          # never cliffhanger (Doomed Doug test, 2026-11-03)
  subtitles: true           # burned-in narration subtitles, Barlow 700 at 50 px on a dark box (Bryce, 2026-11-05)
  publish_times: ["09:00", "14:00", "19:00"]   # New York

social:                     # cross-posting after the video is live on YouTube (studio/meta.py, social.yml)
  facebook_long: true         # episodes as native Facebook Page videos
  facebook_reels: true        # Shorts as Facebook Reels
  facebook_stories: true      # Shorts as 24-hour Page Stories (only within 24 h of going live)
  instagram_reels: true       # needs META_IG_USER_ID (Instagram professional account linked to the Page)
  instagram_stories: true
  hashtags: "#nuclearwar #whatif #simulation #geopolitics #TheDoomsdayMap"

schedule:
  timezone: "America/New_York"
  display_timezone: "Pacific/Auckland"
  publish_time: "19:00"          # New York; 13:00 NZDT next day
  publish_days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
  review_window_days: 0.25    # uploads go private with publishAt at least 6 h ahead (no human review since 2026-11-05)
  episodes_ahead: 2
  launch:
    episodes: 2               # launch phase ended after episode 002
    publish_days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
    queue_target: 1
  human_review: false         # Bryce, 2026-11-05: no approval step; review agents and QC gate quality, production runs in the cloud

youtube:
  playlists:
    flashpoints: "Flashpoints: how a war starts"
    full_exchange: "Full Exchange: launch to impact"
    one_warhead: "One Warhead: a single city"
    day_after: "The Day After"
    marathons: "Full Series and Marathons"
    shorts: "The Doomsday Map Shorts"

