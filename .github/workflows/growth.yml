name: Growth review (weekly)

# Pulls fresh analytics, then the growth analyst writes data/insights/<date>.md: scoreboard, where viewers drop off
# (retention curves mapped to script paragraphs and shots), packaging, competitors, ranked recommendations, topic slate.
# Dispatched by tick.yml on Sundays 20:00 UTC (Monday 09:00 NZDT); this schedule is the fallback.
on:
  schedule:
    - cron: "40 20 * * 0"
  workflow_dispatch:

concurrency:
  group: growth
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  growth:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY_BACKUP: ${{ secrets.ANTHROPIC_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install tools
        run: |
          pip install -q -r requirements.txt
          npm install -g @anthropic-ai/claude-code
          git config user.name "doomsday-map-bot"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
      - run: python -m studio analytics --days 28
        continue-on-error: true
      - run: python -m studio competitors
        continue-on-error: true
      - run: python -m studio scorecard
        continue-on-error: true
      - name: Growth analyst
        run: bash pipeline/claude_run.sh claude_growth.jsonl 150 "$(cat pipeline/prompts/weekly_growth.md)"
      - name: Save
        if: always()
        run: |
          git add -A data .claude CLAUDE.md || true
          (git commit -m "growth review $(date -u +%F)" || true) && git pull --rebase -X theirs && git push
