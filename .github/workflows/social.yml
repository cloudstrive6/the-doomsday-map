name: Social (cross-post to Facebook and Instagram)

# Dispatched by tick.yml every 30 min. Posts what has gone live on YouTube since the last run:
# episodes as native Facebook Page videos, Shorts as Facebook Reels (plus Instagram Reels once an Instagram
# account is linked) and a 24-hour Page Story. Idempotent: state lives in episodes/*/metadata.json and
# episodes/*/shorts_uploaded.json, committed back after each run.
on:
  workflow_dispatch:

concurrency:
  group: social
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  social:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: python -m studio social publish-due
      - name: Save state
        run: |
          git config user.name "doomsday-map-bot"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add episodes/*/metadata.json episodes/*/shorts_uploaded.json 2>/dev/null || true
          (git commit -m "social: cross-post state" || true) && git pull --rebase -X theirs && git push
