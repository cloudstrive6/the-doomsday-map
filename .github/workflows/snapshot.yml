name: Snapshot (daily)

# Competitors' last 50 uploads (views, outliers, views per hour right now) and our own channel analytics,
# saved under data/. The topic picker and growth analyst read these. About 40 API units a day.
on:
  schedule:
    - cron: "45 23 * * *"
  workflow_dispatch:

concurrency:
  group: snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: python -m studio competitors
      - run: python -m studio analytics --days 28
        continue-on-error: true   # a brand-new channel has little analytics yet
      - name: Save
        run: |
          git config user.name "doomsday-map-bot"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add -A data/competitors data/analytics data/reach || true
          (git commit -m "daily snapshot" || true) && git pull --rebase -X theirs && git push
